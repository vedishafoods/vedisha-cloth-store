<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- Background -->
  <rect width="300" height="400" fill="#f0e8d8"/>
  
  <!-- Border -->
  <rect x="10" y="10" width="280" height="380" fill="none" stroke="#8B4513" stroke-width="3"/>
  
  <!-- Traditional top -->
  <path d="M 90 65 L 90 140 L 150 145 L 210 140 L 210 65 Z" fill="#8B1538" opacity="0.95"/>
  
  <!-- Neck piece -->
  <ellipse cx="150" cy="67" rx="32" ry="15" fill="#6B0F2A"/>
  
  <!-- Sleeves -->
  <path d="M 90 75 Q 60 80 55 120 L 80 95" fill="#8B1538" opacity="0.95"/>
  <path d="M 210 75 Q 240 80 245 120 L 220 95" fill="#8B1538" opacity="0.95"/>
  
  <!-- Traditional skirt -->
  <path d="M 70 140 Q 70 160 80 185 L 80 305 Q 85 315 100 318 L 200 318 Q 215 315 220 305 L 220 185 Q 230 160 230 140 Z" fill="#D4AF37" opacity="0.9"/>
  
  <!-- Rich embroidery pattern -->
  <circle cx="100" cy="200" r="6" fill="#8B1538"/>
  <circle cx="200" cy="200" r="6" fill="#8B1538"/>
  <circle cx="150" cy="220" r="6" fill="#8B1538"/>
  <circle cx="100" cy="260" r="5" fill="#8B1538"/>
  <circle cx="200" cy="260" r="5" fill="#8B1538"/>
  <circle cx="150" cy="280" r="5" fill="#8B1538"/>
  
  <!-- Border decoration -->
  <line x1="75" y1="300" x2="225" y2="300" stroke="#8B1538" stroke-width="3"/>
  
  <!-- Title -->
  <text x="150" y="360" font-size="16" font-weight="bold" text-anchor="middle" fill="#8B4513">Kids Traditional</text>
  <text x="150" y="380" font-size="12" text-anchor="middle" fill="#666">Elegant & Premium</text>
</svg>