<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- Background -->
  <rect width="300" height="400" fill="#ffe6f0"/>
  
  <!-- Border -->
  <rect x="10" y="10" width="280" height="380" fill="none" stroke="#8B4513" stroke-width="3"/>
  
  <!-- Dress body -->
  <path d="M 80 70 L 80 240 Q 80 260 85 280 L 215 280 Q 220 260 220 240 L 220 70 Z" fill="#FF69B4" opacity="0.85"/>
  
  <!-- Neckline -->
  <ellipse cx="150" cy="72" rx="30" ry="12" fill="#FF1493"/>
  
  <!-- Sleeves -->
  <ellipse cx="55" cy="90" rx="25" ry="35" fill="#FF69B4" opacity="0.85"/>
  <ellipse cx="245" cy="90" rx="25" ry="35" fill="#FF69B4" opacity="0.85"/>
  
  <!-- Waist detail -->
  <ellipse cx="150" cy="150" rx="50" ry="8" fill="#FFD700" opacity="0.7"/>
  
  <!-- Pattern dots -->
  <circle cx="120" cy="100" r="3" fill="#FFD700"/>
  <circle cx="180" cy="100" r="3" fill="#FFD700"/>
  <circle cx="150" cy="130" r="3" fill="#FFD700"/>
  <circle cx="120" cy="160" r="2" fill="#FFD700"/>
  <circle cx="180" cy="160" r="2" fill="#FFD700"/>
  
  <!-- Hem detail -->
  <line x1="85" y1="275" x2="215" y2="275" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Title -->
  <text x="150" y="360" font-size="16" font-weight="bold" text-anchor="middle" fill="#8B4513">Casual Dress</text>
  <text x="150" y="380" font-size="12" text-anchor="middle" fill="#666">Modern & Trendy</text>
</svg>