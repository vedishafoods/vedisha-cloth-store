<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- Background -->
  <rect width="300" height="400" fill="#e8d5c4"/>
  
  <!-- Decorative border -->
  <rect x="10" y="10" width="280" height="380" fill="none" stroke="#8B4513" stroke-width="3"/>
  
  <!-- Silk Saree -->
  <path d="M 50 85 Q 85 65 150 70 Q 215 65 250 85 L 275 290 Q 150 310 25 290 Z" fill="#4B0082" opacity="0.95"/>
  
  <!-- Silk shine effect -->
  <ellipse cx="150" cy="150" rx="80" ry="100" fill="white" opacity="0.15"/>
  
  <!-- Gold embroidery pattern -->
  <circle cx="100" cy="120" r="4" fill="#FFD700"/>
  <circle cx="150" cy="100" r="4" fill="#FFD700"/>
  <circle cx="200" cy="120" r="4" fill="#FFD700"/>
  <circle cx="120" cy="180" r="3" fill="#FFD700"/>
  <circle cx="180" cy="180" r="3" fill="#FFD700"/>
  <circle cx="150" cy="200" r="3" fill="#FFD700"/>
  
  <!-- Pallu with embroidery -->
  <path d="M 250 85 L 285 160 L 275 290 L 250 280" fill="#FFD700" opacity="0.85"/>
  
  <!-- Gold border -->
  <line x1="30" y1="280" x2="270" y2="295" stroke="#FFD700" stroke-width="3"/>
  
  <!-- Title -->
  <text x="150" y="360" font-size="16" font-weight="bold" text-anchor="middle" fill="#8B4513">Silk Saree</text>
  <text x="150" y="380" font-size="12" text-anchor="middle" fill="#666">Elegant & Luxurious</text>
</svg>