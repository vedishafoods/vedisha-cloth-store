<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- Background -->
  <rect width="300" height="400" fill="#f5e6e8"/>
  
  <!-- Border -->
  <rect x="10" y="10" width="280" height="380" fill="none" stroke="#8B4513" stroke-width="3"/>
  
  <!-- Choli (top) -->
  <path d="M 90 60 L 90 140 L 150 150 L 210 140 L 210 60 Z" fill="#DC143C" opacity="0.9"/>
  
  <!-- Neckline -->
  <ellipse cx="150" cy="62" rx="28" ry="14" fill="#B22020"/>
  
  <!-- Lehenga (skirt) -->
  <path d="M 70 145 Q 70 160 80 180 L 80 300 Q 80 310 90 315 L 210 315 Q 220 310 220 300 L 220 180 Q 230 160 230 145 Z" fill="#FFD700" opacity="0.85"/>
  
  <!-- Embroidery on lehenga -->
  <circle cx="100" cy="200" r="5" fill="#DC143C"/>
  <circle cx="200" cy="200" r="5" fill="#DC143C"/>
  <circle cx="150" cy="220" r="5" fill="#DC143C"/>
  <circle cx="100" cy="250" r="4" fill="#DC143C"/>
  <circle cx="200" cy="250" r="4" fill="#DC143C"/>
  <circle cx="150" cy="270" r="4" fill="#DC143C"/>
  
  <!-- Dupatta (scarf) -->
  <path d="M 210 100 Q 240 120 250 160 L 240 180" fill="none" stroke="#DC143C" stroke-width="8" opacity="0.7"/>
  
  <!-- Gold border on lehenga -->
  <line x1="75" y1="300" x2="225" y2="300" stroke="#B8860B" stroke-width="2"/>
  
  <!-- Title -->
  <text x="150" y="360" font-size="16" font-weight="bold" text-anchor="middle" fill="#8B4513">Lehenga</text>
  <text x="150" y="380" font-size="12" text-anchor="middle" fill="#666">Embroidered & Beautiful</text>
</svg>