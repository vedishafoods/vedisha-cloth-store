<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- Background -->
  <rect width="300" height="400" fill="#e8f4f8"/>
  
  <!-- Border -->
  <rect x="10" y="10" width="280" height="380" fill="none" stroke="#8B4513" stroke-width="3"/>
  
  <!-- Shirt body -->
  <path d="M 75 85 L 75 260 L 225 260 L 225 85 Z" fill="#4A90E2" opacity="0.9"/>
  
  <!-- Collar -->
  <path d="M 130 85 L 120 100 L 150 105 L 180 100 L 170 85" fill="white" opacity="0.9"/>
  
  <!-- Front buttons -->
  <circle cx="150" cy="120" r="4" fill="white" opacity="0.7"/>
  <circle cx="150" cy="150" r="4" fill="white" opacity="0.7"/>
  <circle cx="150" cy="180" r="4" fill="white" opacity="0.7"/>
  <circle cx="150" cy="210" r="4" fill="white" opacity="0.7"/>
  
  <!-- Sleeves -->
  <rect x="40" y="95" width="35" height="100" fill="#4A90E2" opacity="0.9" rx="12"/>
  <rect x="225" y="95" width="35" height="100" fill="#4A90E2" opacity="0.9" rx="12"/>
  
  <!-- Pocket -->
  <rect x="95" y="160" width="30" height="30" fill="#5BA3F5" opacity="0.6" rx="2"/>
  
  <!-- Cuff details -->
  <line x1="40" y1="185" x2="75" y2="190" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="225" y1="190" x2="260" y2="185" stroke="white" stroke-width="2" opacity="0.5"/>
  
  <!-- Title -->
  <text x="150" y="360" font-size="16" font-weight="bold" text-anchor="middle" fill="#8B4513">Kids Shirt</text>
  <text x="150" y="380" font-size="12" text-anchor="middle" fill="#666">Smart & Stylish</text>
</svg>