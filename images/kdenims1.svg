<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- Background -->
  <rect width="300" height="400" fill="#f0f0f0"/>
  
  <!-- Border -->
  <rect x="10" y="10" width="280" height="380" fill="none" stroke="#8B4513" stroke-width="3"/>
  
  <!-- Waistband -->
  <ellipse cx="150" cy="85" rx="60" ry="8" fill="#333"/>
  
  <!-- Left pant leg -->
  <path d="M 110 90 L 100 180 L 95 280 L 130 285 L 135 180 L 145 90" fill="#1E3A8A" opacity="0.95"/>
  
  <!-- Right pant leg -->
  <path d="M 190 90 L 200 180 L 205 280 L 170 285 L 165 180 L 155 90" fill="#1E3A8A" opacity="0.95"/>
  
  <!-- Zipper -->
  <line x1="150" y1="90" x2="150" y2="140" stroke="#C0C0C0" stroke-width="2"/>
  
  <!-- Pocket details -->
  <path d="M 120 120 L 130 140" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.6"/>
  <path d="M 180 120 L 170 140" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.6"/>
  
  <!-- Stitching line -->
  <line x1="110" y1="90" x2="110" y2="280" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="190" y1="90" x2="190" y2="280" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  
  <!-- Hem -->
  <line x1="95" y1="280" x2="205" y2="280" stroke="#0EA5E9" stroke-width="2" opacity="0.6"/>
  
  <!-- Title -->
  <text x="150" y="360" font-size="16" font-weight="bold" text-anchor="middle" fill="#8B4513">Kids Denims</text>
  <text x="150" y="380" font-size="12" text-anchor="middle" fill="#666">Cool & Durable</text>
</svg>