<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- Background -->
  <rect width="300" height="400" fill="#f5e6d3"/>
  
  <!-- Decorative border -->
  <rect x="10" y="10" width="280" height="380" fill="none" stroke="#8B4513" stroke-width="3"/>
  
  <!-- Traditional Saree Design -->
  <defs>
    <pattern id="pattern1" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="3" fill="#D4AF37"/>
    </pattern>
  </defs>
  
  <!-- Saree body -->
  <path d="M 50 80 Q 80 60 150 70 Q 220 60 250 80 L 280 300 Q 250 320 150 320 Q 50 320 20 300 Z" fill="#8B0000" opacity="0.9"/>
  
  <!-- Gold pattern overlay -->
  <path d="M 50 80 Q 80 60 150 70 Q 220 60 250 80 L 280 300 Q 250 320 150 320 Q 50 320 20 300 Z" fill="url(#pattern1)" opacity="0.4"/>
  
  <!-- Pallu (saree end) -->
  <path d="M 250 80 L 280 150 L 270 300 L 250 280" fill="#FFD700" opacity="0.8"/>
  
  <!-- Border details -->
  <line x1="30" y1="280" x2="270" y2="300" stroke="#FFD700" stroke-width="2"/>
  <line x1="35" y1="270" x2="265" y2="285" stroke="#FFD700" stroke-width="1"/>
  
  <!-- Title -->
  <text x="150" y="360" font-size="16" font-weight="bold" text-anchor="middle" fill="#8B4513">Traditional Saree</text>
  <text x="150" y="380" font-size="12" text-anchor="middle" fill="#666">Premium Quality</text>
</svg>