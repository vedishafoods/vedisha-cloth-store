<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- Background -->
  <rect width="300" height="400" fill="#f0e8d8"/>
  
  <!-- Border -->
  <rect x="10" y="10" width="280" height="380" fill="none" stroke="#8B4513" stroke-width="3"/>
  
  <!-- Kurta body -->
  <path d="M 70 60 L 70 280 Q 70 300 80 310 L 220 310 Q 230 300 230 280 L 230 60 Z" fill="#C1272D" opacity="0.9"/>
  
  <!-- Center design line -->
  <line x1="150" y1="60" x2="150" y2="310" stroke="#FFD700" stroke-width="2" opacity="0.6"/>
  
  <!-- Neckline -->
  <ellipse cx="150" cy="65" rx="25" ry="15" fill="#B22020"/>
  
  <!-- Decorative elements -->
  <rect x="100" y="120" width="100" height="80" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
  <circle cx="130" cy="150" r="5" fill="#FFD700"/>
  <circle cx="170" cy="150" r="5" fill="#FFD700"/>
  <circle cx="150" cy="180" r="5" fill="#FFD700"/>
  
  <!-- Sleeves -->
  <rect x="40" y="80" width="30" height="120" fill="#C1272D" opacity="0.9" rx="15"/>
  <rect x="230" y="80" width="30" height="120" fill="#C1272D" opacity="0.9" rx="15"/>
  
  <!-- Title -->
  <text x="150" y="360" font-size="16" font-weight="bold" text-anchor="middle" fill="#8B4513">Kurta Suit</text>
  <text x="150" y="380" font-size="12" text-anchor="middle" fill="#666">Stylish & Comfortable</text>
</svg>