<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inquiry Form | Vedisha Cloth Store</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap');
body { margin: 0; font-family: 'Manrope', 'Aptos', sans-serif; background: #f5f1ed; color: #333; font-size: 18px; line-height: 1.7; }
h2 { font-family: 'Cormorant Garamond', serif; text-align: center; }
.box { max-width: 600px; margin: 40px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
label { display: block; margin-top: 12px; font-weight: 600; }
input, textarea { width: 100%; box-sizing: border-box; padding: 10px; font: inherit; border: 1px solid #ccc; border-radius: 6px; }
button { margin-top: 18px; padding: 10px 24px; font: inherit; background: #25d366; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <h2>Inquiry Form</h2>
  <form action="mailto:vedprish20162021@gmail.com" method="post" enctype="text/plain">
    <label for="name">Name</label>
    <input id="name" name="Name" required>
    <label for="phone">Phone</label>
    <input id="phone" name="Phone" type="tel" required>
    <label for="email">Email</label>
    <input id="email" name="Email" type="email">
    <label for="message">Inquiry</label>
    <textarea id="message" name="Inquiry" rows="5" required></textarea>
    <button type="submit">Send Inquiry</button>
  </form>
</div>
</body>
</html>
